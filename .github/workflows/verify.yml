name: verify

# Gap G-050. Until this existed, 636 tests, 25 migrations and seven live
# verification scripts ran only when somebody remembered to run them — so
# every claim that something was tested rested on a human having typed
# `npm run check`. Directive §39 asks for the opposite: CI must prove the
# tests actually run, the migrations actually apply, and the secret scan
# actually passes.
#
# Two jobs, because they cost very different amounts. `check` is seconds and
# gates everything. `database` starts Postgres, applies every migration from
# scratch and runs the live scripts against it — minutes, and worth it,
# because it is the only place the invariants the money code depends on are
# actually exercised.

on:
  pull_request:
  push:
    branches: [main]

# A second push supersedes the first. The database job is slow and there is no
# value in finishing a run for a commit that has already been replaced.
concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    name: typecheck · lint · tests · secrets · build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          # The secret scan reads `git ls-files`, which needs the checkout to
          # be a real repository rather than an export.
          #
          # Full history, not one commit: G-104. `check-record.mjs` §7 reads
          # every commit subject for the `(#NN)` a merge leaves behind, and
          # fails on a pull request the change log never recorded. At depth 1
          # it would see one subject and pass on a log that had stopped being
          # kept — a check that cannot see the drift it exists to catch.
          fetch-depth: 0

      # 26, not the runtime's minimum. `mock.module` on an aliased specifier
      # does not work before it — on Node 22 six test files fail to load with
      # "does not provide an export named 'createClient'" — so this pins the
      # version the suite is actually verified on. It is a test-toolchain
      # requirement, not a runtime one: `engines.node` stays at the app's real
      # floor, which Vercel builds against.
      - uses: actions/setup-node@v4
        with:
          node-version: 26
          cache: npm

      - run: npm ci

      - name: Secret scan
        run: node scripts/scan-secrets.mjs

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Tests
        run: npm test

      # Gap G-094. The plan and its machine-readable copy drifted from the repo
      # twice, in both directions, while §4.8 claimed to be generated. This
      # re-derives every number in them — gap totals from the gap records, the
      # baseline from the filesystem, the test counts from a run — and fails on
      # a disagreement. It re-runs the suite, which is two seconds, because a
      # count nobody re-derives is the kind that drifted by 201.
      - name: The record against the repository
        run: npm run check:record

      # Placeholders, deliberately. The build must not need real credentials —
      # if it ever does, that is a defect worth failing on rather than a secret
      # worth adding here. Nothing below reaches a network.
      - name: Build
        run: npm run build
        env:
          NEXT_PUBLIC_SUPABASE_URL: https://placeholder.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: placeholder-anon-key-not-a-real-one
          SUPABASE_SERVICE_ROLE_KEY: placeholder-service-key-not-a-real-one

  database:
    name: migrations · live verification
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 26
          cache: npm

      - run: npm ci

      # Pinned rather than `latest`, for two reasons found the hard way. The
      # action resolves `latest` through the GitHub API, which is rate-limited
      # and failed a run of this workflow with nothing wrong in the repository.
      # And `latest` means a CLI release can break CI on a day nobody touched
      # the code — the same argument this project makes about every other
      # dependency. Matches the version in devDependencies, so a local run and
      # a CI run apply migrations with the same tool.
      - uses: supabase/setup-cli@v1
        with:
          version: 2.112.0

      # `db reset` applies every migration from scratch and then the seed, so a
      # migration that only works against an already-migrated database fails
      # here rather than in production.
      - name: Start Postgres and apply every migration
        run: supabase start && supabase db reset

      # An untested backup is a hypothesis. Dump the freshly-built database,
      # restore the dump alone into a scratch database, and prove every
      # application table equal — counts and contents, from one shared MVCC
      # snapshot, so platform churn after `db reset` cannot fake a tear.
      # Non-destructive: the source is only read.
      - name: Restore rehearsal — the local backup is proven restorable
        run: npm run db:rehearse:restore

      # The verification scripts refuse to run against a database they were not
      # pointed at, so the target is written explicitly rather than inherited.
      - name: Point the verification scripts at the CI database
        run: |
          {
            echo "NEXT_PUBLIC_SUPABASE_URL=$(supabase status -o json | jq -r .API_URL)"
            echo "NEXT_PUBLIC_SUPABASE_ANON_KEY=$(supabase status -o json | jq -r .ANON_KEY)"
            echo "SUPABASE_SERVICE_ROLE_KEY=$(supabase status -o json | jq -r .SERVICE_ROLE_KEY)"
            echo "SUPABASE_JWT_SECRET=$(supabase status -o json | jq -r .JWT_SECRET)"
            echo "NEXT_PUBLIC_APP_URL=http://localhost:3000"
            echo "CRON_SECRET=ci-cron-secret-not-a-real-one"
            echo "VAULT_ENCRYPTION_KEY=ci-vault-encryption-key-not-a-real-one-32chars"
            echo "WHATSAPP_VERIFY_TOKEN=ci-whatsapp-verify-token-not-a-real-one"
            echo "WHATSAPP_APP_SECRET=ci-app-secret-not-a-real-one"
            # The proposal script runs its own stub model server on 54399 and
            # points the SDK at it, so the extraction path is exercised end to
            # end without a real provider. Both values are the ones
            # .env.verify.local.example documents; neither is a credential.
            echo "ANTHROPIC_API_KEY=verify-stub-key-not-a-real-credential"
            echo "ANTHROPIC_BASE_URL=http://127.0.0.1:54399"
            # Flow 01 proves the OUTBOUND leg too, which no check before it
            # did — the sixteen outbound checks all tested the database half
            # and none of them sent anything. verify-flow-01 runs a Graph stub
            # on 54398 and points the sender at it, so a real message leaves
            # AgencyOS and is received, without Meta being involved. Neither
            # value is a credential.
            echo "WHATSAPP_ACCESS_TOKEN=ci-graph-token-not-a-real-one"
            echo "WHATSAPP_GRAPH_BASE_URL=http://127.0.0.1:54398"
            # Speech to text (ADM-94). verify-media-reading runs its own stub
            # transcriber on 54397 and points the adapter at it, so a voice
            # note is genuinely uploaded and genuinely transcribed without a
            # vendor account. The key is a stand-in and never leaves the job.
            echo "OPENAI_API_KEY=ci-key-not-a-real-credential"
            echo "OPENAI_BASE_URL=http://127.0.0.1:54397"
          } >> .env.verify.local

      # Authority cannot be forged: consent rows cannot be erased while their
      # contact exists, and a handoff cannot declare itself done — the status
      # machine, the verifier mirror, and the frozen-verdict rule, all
      # exercised in both directions against the live schema.
      - name: Authority guards — consent and completion
        run: npm run db:verify:authority

      # The class this session found three times: a SECURITY INVOKER function the
      # app calls with the user's session, writing a table whose RLS lacks the
      # policy that write needs — silently broken for authenticated callers while
      # service-role verify scripts stay green. The audit function enumerates any
      # recurrence and this asserts it finds none.
      - name: INVOKER/RLS class — no silently-broken authenticated write path
        run: npm run db:verify:invokerrls

      # The mirror class: a permissive end-user write policy gated by role alone,
      # with no tenant predicate, on a shared table — a cross-tenant write RLS
      # admits regardless of tenant (ai.agents, #…380000). The audit enumerates
      # any recurrence; this asserts none, and red-proofs that an authenticated
      # owner cannot write the global agent registry.
      - name: Untenanted write policies — the registry is not tenant-writable
        run: npm run db:verify:untenanted

      # A child row cannot claim a tenant its parent does not share: the graft
      # is refused on INSERT and UPDATE across schemas, the SET NULL cascade
      # still passes, and no org-scoped foreign key is left unguarded.
      - name: Tenancy guards — a child belongs to its parent's tenant
        run: npm run db:verify:tenancyguards

      # G-281. `not NULL` is NULL and plpgsql's `if` does not execute it, so a
      # guard written `or not (select core.can_write())` falls THROUGH for a
      # token with no role. Proved by minting that token and calling real
      # doors — and the catalogue scan makes the forty-ninth occurrence fail
      # here rather than in a second audit a month later.
      - name: Authority guards cannot fail open — G-281
        run: npm run db:verify:failopen

      # G-119, and first because every other queue depends on it. claim_jobs
      # could take EVERY queued job of a kind in one statement — `LIMIT NULL`
      # is no limit — hand them to one worker and strand all but one in
      # `running` until the reaper. Single worker, concurrent workers, the
      # lock, a crashed worker, lease recovery, retries and idempotency.
      - name: The job claim — G-119
        run: npm run db:verify:claims

      # G-086, ADM-41. A lead converted straight from `new` had no record of
      # ever having been qualified — harmless to the database, wrong in every
      # funnel report, and wrong in the direction that makes the step look
      # skipped for deals that were won. The checks that matter are the two
      # negatives: an existing date is never replaced, and a disqualified lead
      # is never stamped.
      - name: Qualification on conversion — G-086
        run: npm run db:verify:qualification

      # G-092 and the open half of G-089, ADM-43. A deal had no update path at
      # all, so one lost at one value and re-won at another converted into a
      # project budgeted at the old one. The checks that carry it are the
      # refusals: a settled deal keeps its terms, a null means leave alone
      # rather than clear, and a no-op writes no audit row for an edit that
      # did not happen.
      - name: Deal terms and reopen hygiene — G-092, G-089
        run: npm run db:verify:dealterms

      # G-088, ADM-05 and ADM-42. The database has permitted a second
      # engagement since D21's partial index; the application's pre-check had
      # no stage filter, so a lead whose only deal was lost handed that lost
      # deal back. Seven cases, and the two that matter most are opposite: a
      # settled deal must step aside, and an open one must not.
      - name: A settled deal does not block the next — G-088
        run: npm run db:verify:second

      - name: Schema, RLS and policies
        run: npm run db:verify

      - name: Milestone invoicing — D1, D2, D4 concurrency
        run: npm run db:verify:billing

      - name: Inbound WhatsApp ingest
        run: npm run db:verify:ingest

      # Audit step 1.1. crm.leads.source allowed web_form/email since the
      # first migration and nothing ever produced either value — the queue
      # only ever showed WhatsApp. Same atomicity/idempotency proof as the
      # WhatsApp ingest above, for the two channels that carry a narrative
      # message and continue one thread per identity.
      - name: Inbound web-form ingest — audit step 1.1
        run: npm run db:verify:webform

      - name: Inbound email ingest — audit step 1.1
        run: npm run db:verify:emailingest

      # A Lead Ad submission has no narrative — no conversation, no job — but
      # the same tenancy resolution, contact dedupe and idempotent-on-leadgen_id
      # replay guard as the other two.
      - name: Inbound Facebook/Instagram Lead Ads ingest — audit step 1.1
        run: npm run db:verify:fbleads

      # G-040. Runs against the schema alone — no application build needed,
      # because every rule it checks is held in Postgres rather than in a
      # service. That is the point of the engine living there.
      - name: The approval engine — ADM-08
        run: npm run db:verify:approvals

      # G-053. Plants a dead job, a stalled one, a stuck one and an
      # unpublished event, then checks the counts and the alert suppression —
      # both of which are database behaviour, and both of which are worse than
      # useless when wrong.
      - name: The operational backlog — G-053
        run: npm run db:verify:backlog

      # G-014. The Graph API is not called: what can lose a client's message is
      # the seq allocation two repliers race for and the idempotency key that
      # decides whether a retry is a second message. Both are in the database.
      - name: Outbound messages — G-014
        run: npm run db:verify:outbound

      # C10. The second delivery axis: what Meta reports the wire did to an
      # outbound message (delivered/read/failed), recorded monotonically and
      # tenant-scoped, never able to touch an inbound message.
      - name: Delivery receipts — C10
        run: npm run db:verify:receipts

      # Phase 12. The first caller of the approval engine from outside itself:
      # a deliverable submitted for review becomes an approval request, and the
      # client's decision comes back onto the version it was about.
      - name: Deliverables and client review — Phase 12
        run: npm run db:verify:deliverables

      # G-011, ADM-07 — staff draft, the owner approves, then it is sent. The
      # second caller of the approval engine, and the first that carries money:
      # the total travels with the request, so it is what resolves the
      # approver. Worth running for the arithmetic above all — a line posted
      # straight through PostgREST with a total that disagrees with its own
      # quantity and price would otherwise choose its own approver.
      - name: Quotations — G-011
        run: npm run db:verify:quotations

      # G-166, ADM-97. One opportunity, two or three plans, one approval on the
      # recommended plan at its price, and the client picks one. The 2-3 cap and
      # the required recommendation are self-red-proving here: drop either
      # control and the refusals flip to 'created', turning the run red. The
      # rest proves what the re-keyed live index makes possible — a set and a
      # standalone quote cannot both be live — and that a choice mints one
      # winner, its siblings superseded (never deleted), the set accepted with
      # one plan_set.accepted carrying the chosen plan's total.
      - name: The quotation offers a choice — G-166
        run: npm run db:verify:planset

      # G-230. A deal reaches `won` only on an accepted quotation version, and
      # the refusal is the ROW's — driven through raw PostgREST, because a
      # control tested only through the service that also holds it is half a
      # check. Self-red-proving: every section asserts a refusal, so dropping
      # `opportunities_won_gate` turns the run red without a mangling pass.
      - name: A deal that is won says what was won (G-230)
        run: npm run db:verify:wongate

      # Owner decisions 10, 11, 14. A contract lives only on a WON deal and is
      # written only through its doors; a lead's files carry to the project
      # once (six simultaneous claims, one winner); "when a lead last wrote" is
      # the newest client message.
      - name: A won deal has a contract and a lead keeps its files (decisions 10, 11, 14)
        run: npm run db:verify:contracts

      # W2 (20261006200000): a blocked task keeps its type, owner and next action; an agent task
      # cannot be completed until verified; the Meetings folder; template clone; the organisation's
      # project defaults (and the standard folders a new project gets); the audit-trail activity
      # feed; a meeting attached to the project its client owns.
      - name: Projects, tasks and plan (W2)
        run: npm run db:verify:w2-projects

      # Trace B (20261008120000): a task enters Review only from in progress and with evidence (a
      # trigger, whichever path writes); a milestone's due date change is audited; the schedule-change
      # door returns the dates that really moved and, for the Notifications inbox, only what concerns the caller.
      - name: Review hand-off, date history and schedule notices (trace B)
        run: npm run db:verify:trace-b

      # G-227, P0. Idempotency cannot be proved by reading a migration: an
      # index that refuses a duplicate and an index that was never created look
      # identical in source until two callers arrive at once. This fires EIGHT
      # simultaneous bookings with one key and counts the survivors.
      - name: A retry that books twice (G-227)
        run: npm run db:verify:booking

      # G-243. The offer and the re-check, the two doors before G-227's:
      # up to three slots that were READ, refusals by name, the row's own
      # bound on the list, a booking refused on a stale read and landing on
      # a fresh re-check with the provider event and link on the row.
      - name: A slot is offered, and taken (G-243)
        run: npm run db:verify:offer

      # G-244. §8 in G-225's shape: the booked row cancelled with a reason
      # that says rescheduled and every other column kept, its reminder
      # dropped, a new requested row carrying supersedes_id and what
      # identifies the meeting, then offered and booked like any other.
      - name: A reschedule is a new row (G-244)
        run: npm run db:verify:reschedule

      # G-228. Review found the reminder path had no live coverage at all — and
      # that its first draft could not be called by anyone. This drives the
      # real jobs table: schedule, replace after a move, reuse a job that
      # already ran, refuse to touch one that is running, and drop the queued
      # one when the meeting is cancelled.
      - name: A reminder for a meeting that moved (G-228)
        run: npm run db:verify:reminders

      # G-237. The four conclusion doors driven as the service role, an owner,
      # a member, a client, another organization's owner and a token with no
      # user row: complete with a note (evidence + analysis queued), no-show
      # after the time and never before it, cancel keeping history and
      # dropping the reminder, evidence by name, the timezone trigger.
      - name: A meeting is concluded by a person (G-237)
        run: npm run db:verify:meeting-commands

      # G-016, ADM-05. Half of this asserts what already worked — one lead per
      # person, and a won deal not blocking the next — because that is what
      # makes the new half meaningful. The other half is the three things it
      # must NOT do: reopen the lead, invent a follow-up date, or open a deal
      # unasked. Those are the ones somebody would "fix" wrongly later.
      - name: A returning client — G-016
        run: npm run db:verify:returning

      # G-020, ADM-16. Two refusals carry this one: a requirement version that
      # nobody accepted is not a scope, and one belonging to another
      # engagement must never be planned into this project — the check that
      # stops a plausible-looking breakdown of the wrong client's scope. The
      # engagement is reached through the opportunity, because
      # projects.lead_id is a core.users reference and joining on it would
      # silently match nothing (G-117).
      - name: Requirement → feature → task — G-020
        run: npm run db:verify:chain

      # The transcript-state key is a PARTIAL unique index, and its predicate
      # is the whole point: a `failed` version records that no proposal was
      # produced, so it must not occupy the slot a retry needs. Asserted
      # against real Postgres rather than by reading the migration, because
      # whether `status <> 'failed'` excludes a row is a claim about SQL, and
      # the bug it replaces looked correct in the source too.
      - name: A failed extraction does not wedge its transcript
        run: npm run db:verify:extractionretry

      # ADM-11 grants automatic sending with nobody reading it first, and names
      # the risk itself: "including messages that may carry a price, discount or
      # delivery promise". ADM-22 forbids an agent stating a price at any level.
      # The rule is a trigger over a regex, and both halves read correct while
      # behaving otherwise if you get them wrong — the first draft used `\b` for
      # a word boundary, which in Postgres is a backspace character.
      - name: An automated message may not state a price
        run: npm run db:verify:unreadprice

      # Document 11 had fourteen pages and no tables. The baseline, its
      # immutability once frozen, and the change request that is the only way
      # to move it — every rule is a trigger, a partial unique index or a row
      # lock, and none can be checked by reading TypeScript.
      - name: A scope baseline moves only by transition — Doc 11
        run: npm run db:verify:scope

      # Every integration key is kept in one encrypted vault. Who may store,
      # replace and revoke one, that no role can reach the table directly, and
      # that the audit names the slot and never the value are all database
      # rules: a policy with no grant, four security-definer doors, an
      # append-only log. None can be checked by reading TypeScript.
      - name: A key is kept in one place — the Keys & secrets vault
        run: npm run db:verify:vault

      # W6 / SCR-064. A model has a monthly budget of its own: only the owner
      # sets it, the model must be in the registry, no role writes the table
      # directly and the audit names the model. All database rules.
      - name: A model has a monthly budget of its own
        run: npm run db:verify:modelbudget

      # Trace D / SCR-055, SCR-065. Recording or correcting an expense is
      # audited with before and after (a trigger, so every path is covered),
      # and the spend-by-project view keeps the runs that belong to no project.
      - name: An expense is audited and no AI spend is hidden
        run: npm run db:verify:trace-d

      # Theme W5 — QA, release, communication. A run's tester and environment,
      # append-only run evidence, editable cases and coverage waivers, an
      # unsupported device that must say why, a release recorded with no
      # handover, an announcement tied to its project and drafted by a met
      # milestone, a retry that says why, and the email lane: all database
      # rules, none of which reading TypeScript can prove.
      - name: A run names its tester, a release needs no handover, an announcement has a project
        run: npm run db:verify:w5

      # UI parity round 2. A task's start never passes its due date, a subtask
      # is one level deep in its parent's project, labels are bounded and
      # de-duplicated, and a project note can only be written through its two
      # audited doors — all database rules (a CHECK, a trigger, a table with
      # no write grant), none of which reading TypeScript can prove.
      - name: A task has a start, a parent and labels, and a project keeps notes
        run: npm run db:verify:taskschedule

      # UI parity round 3, stream R1 (the owner's decisions of 2026-10-03). Each
      # is a database rule, none of which reading TypeScript can prove:
      # open sprints of a project never overlap and a task sits only in a
      # sprint of its own project (a trigger); a department is one of six
      # names (a CHECK) set only by an owner or ops admin; a project type is
      # from a fixed list and chips are bounded; a requirement's priority and
      # assignee change after the freeze without touching the frozen row, and
      # its attachments are links to the project's own files; a folder is a
      # record, empty folders exist, and a file can only be filed into a real
      # folder of its own category.
      - name: A project runs in sprints of a fixed length
        run: npm run db:verify:sprints
      - name: A member belongs to a department
        run: npm run db:verify:department
      - name: A project has a type, a technology and tags
        run: npm run db:verify:classification
      - name: A requirement has a priority, an assignee and linked files
        run: npm run db:verify:requirementplan
      - name: A project has folders that exist before a file is in them
        run: npm run db:verify:folders
      - name: Requirements, design, prototype and development doors
        run: npm run db:verify:w4

      # The wording of a quotation's acceptance, cancellation, liability and
      # jurisdiction clauses is the owner's, appended a version at a time and
      # never edited, and a quotation keeps the clause it printed. Who may
      # publish, that nothing is edited or deleted, that a draft stores no
      # snapshot and an issued quotation's cannot be rewritten are database
      # rules: a trigger, a row lock, a policy with no write grant. None can be
      # checked by reading TypeScript.
      - name: The clauses a quotation prints are the owner's, and are kept
        run: npm run db:verify:clauses

      # A requirement is commented on through one audited door, and a comment
      # on a frozen requirement never reopens the baseline. Who may comment,
      # that the table has no write grant and that the audit never carries the
      # words are database rules, none of which reading TypeScript can prove.
      - name: A requirement can be commented on
        run: npm run db:verify:reqcomments

      # Document 05 is thirteen pages and had no tables. Two rules are
      # structural rather than advisory and both are checked here: a memory
      # claiming explicit or verified confidence must carry provenance, and an
      # AGENT may never write `verified` — the memory version of a producer
      # verifying its own work.
      - name: A guess cannot become a client fact — Doc 05
        run: npm run db:verify:memory

      # G-115. The checks that carry this one are all negatives: a group
      # message must create NO lead, NO contact and NO extraction job. Before
      # it, routing a group message through the 1:1 ingest would have opened a
      # sales lead on whichever colleague typed in the approval group — and
      # measured as a delta, because a total tells you nothing.
      - name: Inbound group messages — G-115
        run: npm run db:verify:groupin

      # G-017, ADM-06. The check that matters most is the negative one: two
      # projects, one with nothing ticked and one with everything, are asked
      # the same start question and must answer identically. "The onboarding
      # checklist blocks nothing" is the kind of rule that rots silently, and
      # this is what would notice.
      - name: Onboarding — G-017
        run: npm run db:verify:onboarding

      # G-030 and the gate ARCHITECTURE.md §4.8 states. The scoping is the
      # part worth running: a blocker on v1 must not stop v2, because v2 is
      # the fix, and project-wide scoping would make the fix unshowable.
      - name: Phase 3, end to end — G-299
        run: npm run db:verify:phase3

      - name: The QA gate — G-030
        run: npm run db:verify:qa

      # G-032, directive §22. The check that matters most here is that a
      # credential row cannot hold a credential: a column with a client's
      # production password in it is the same leak as the chat message, with
      # a longer retention period.
      - name: Handover — G-032
        run: npm run db:verify:handover

      # G-024, G-025. module_id and project_id are separate references, so
      # nothing in a foreign key stops a task naming another project's module
      # — the shape D22 was. And a build's test access must not carry the
      # credentials it describes.
      - name: Modules and test access — G-024, G-025
        run: npm run db:verify:modules

      # G-057. The portal renders whatever RLS returns, so it is only as
      # correct as these policies are — and every interesting case is negative:
      # an internal project, a draft, another account's work.
      - name: What a client can see — G-057
        run: npm run db:verify:portal

      # G-033, directive §23. Five tables, one answer — and the figures worth
      # driving are the ones an agency argues about at the end of a project:
      # what was billed against what arrived, and how often the work went
      # round again.
      - name: The completion summary — G-033
        run: npm run db:verify:summary

      # G-004. Mostly a test of what must NOT move: a draft, a paid invoice, a
      # void one, one with no due date. The transition itself is one line; the
      # value is in the five things it leaves alone.
      - name: Invoices going overdue — G-004
        run: npm run db:verify:overdue

      # G-005. Money leaving the business: it needs an approved approval
      # behind it, it cannot exceed what came in — counting requests still
      # waiting — and the invoice does not move, because paid is terminal.
      - name: Refunds — G-005
        run: npm run db:verify:refunds

      # Doc 15 §15, §29. The record of somebody checking recorded payments
      # against the bank — and the rule that shapes all of it: "Reconciliation
      # must not silently alter historical transactions." The last two checks
      # read the payment and the invoice back and assert nothing moved.
      - name: Reconciliation — Doc 15 §15, §29
        run: npm run db:verify:reconciliation

      # G-041. The runner checks the level for the message; this checks that
      # the database refuses the same thing, so a caller that skips the check
      # is refused rather than obeyed — D16's rule, one schema along.
      - name: Agent autonomy — G-041
        run: npm run db:verify:autonomy

      # G-130. ADM-83 granted `definition_version` and `last_validated_at` and
      # nothing ever wrote either, so every row read `null` — which the column
      # comment defines as never validated. check-record §14 proves the SEED
      # matches the registry and says in its own comment why that is not
      # enough: enabling an agent is an UPDATE by design, so a live row can
      # diverge with no diff to review. This is the half that needs a database.
      - name: Agent definitions — G-130
        run: npm run db:verify:definitions

      # Fifty-odd scripts above prove individual joints. This one proves the
      # joints CONNECT: one lead created the way a real one is created, carried
      # through Document 02's whole lifecycle to handover, asserting at every
      # seam that the identity established by the inbound message is still the
      # identity being handed over at the end.
      #
      # It existed in package.json and CI ran it nowhere. A verification nobody
      # runs is a verification that has already stopped being true — it just
      # has not been asked yet. Found while wiring layer 2 and 3, which is the
      # first change big enough to have broken it.
      - name: One lead, end to end — Doc 02
        run: npm run db:verify:journey

      # ADM-88 declined a numeric lead score. The columns existed anyway, the
      # SEED filled two of them, and the leads list rendered `· score 82` — so
      # every fresh environment advertised a feature that does not exist. The
      # decision is now a CHECK constraint, because the next thing to reach for
      # an empty 0-100 column beside a lead is an agent asked to qualify it.
      - name: A lead carries no invented score — ADM-88
        run: npm run db:verify:noscore

      # Doc 12 §9: "This matrix is one of the main controls preventing an AI
      # designer from producing attractive but incomplete work." A deliverable
      # is filed against a PROJECT and the agreement lives in scope_items, and
      # until now nothing joined them — so "the design is approved" and "the
      # design covers the scope" were two unrelated facts.
      - name: A design must cover what was agreed — Doc 12
        run: npm run db:verify:uicoverage

      # Doc 14 §31 is a list of nine ways a system lies to itself about being
      # ready. Three are structural here: a run names the exact build it was
      # run against, skipped is its own column and the counts must add up, and
      # an agent-authored run must carry a re-checkable artefact. NO SCORE is
      # computed — §19 leaves the weights to the Admin Policy Engine, and a
      # gate with no evidence reports undecided rather than passing.
      - name: Evidence is not confidence — Doc 14
        run: npm run db:verify:gates

      # Doc 15 §23: "Never mark a milestone paid from a client message alone."
      # ADM-04 already separated recorded from verified at the LEDGER; what was
      # missing is somewhere for a claim to live before it reaches the ledger,
      # because a payment row counts toward the invoice ceiling and a false one
      # can then only be removed by a delete the guards refuse. The control is
      # an absence — there is no verified_by_agent column — and an absence can
      # only be checked by trying to use it.
      - name: A payment is claimed, then verified — Doc 15
        run: npm run db:verify:paymentverify

      # Doc 18 §35 "Never classify new scope as maintenance to avoid approval"
      # and §18 "Do not label a bug as a paid feature" are the same rule in two
      # directions, and both cost somebody money. §6's classification now
      # decides which exit a ticket may take, and both exits — Doc 11's change
      # requests and G-036's upsell signals — already existed.
      - name: New scope cannot hide inside maintenance — Doc 18
        run: npm run db:verify:maintenance

      # Doc 23 §7 lists twenty-six canonical business events and AgencyOS
      # emitted none of them — §7 names business milestones, the repository
      # named row states, and six of §7's events describe transitions this
      # system performs and records silently. The emitted set is now closed
      # (a typo cannot become a durable row nothing will ever match) and the
      # six are written where their state changes.
      - name: The events the documents name — Doc 23
        run: npm run db:verify:events

      # G-133 and G-134. Both controls existed as schema and neither was
      # connected: max_steps/max_cost_minor had no consumer, handoffs.depth had
      # no producer, and budget_exceeded had never been set by any code. A
      # trigger that does not fire is indistinguishable from one that does
      # until something depends on it, so this drives real rows.
      - name: Agent ceilings — G-133, G-134
        run: npm run db:verify:ceilings

      # G-012, ADM-70, ADM-81. ADM-70 required suppression to be enforced by
      # the communication system rather than the UI, so the only honest test
      # calls the communication system. It also covers the trap ADM-70 named:
      # the approval announcement runs through the same chokepoint and must
      # still get through, or G-110 breaks silently.
      - name: Consent before sending — G-012
        run: npm run db:verify:consent

      # G-222, ADM-101. Consent was asymmetric — an inbound message granted it
      # (ADM-92) and nothing withdrew it, so a client who replied "STOP" kept
      # being messaged. This proves the missing producer: a client STOP flips
      # the row to withdrawn (an UPDATE, not a forge-shaped insert), the send is
      # then refused, a later ordinary message does not re-grant, and the false
      # positive that would silence a live client ("stop the ads") does not fire.
      - name: An inbound STOP is heard — G-222
        run: npm run db:verify:optout

      # G-012, ADM-69. The no-duplicate-messages guarantee is a race a unit
      # test cannot reach: one process, one connection, no concurrency. This
      # fires two genuinely concurrent inserts and checks exactly one survives.
      # It also covers the tenancy link RLS cannot express — a send whose
      # organization differs from its sequence's.
      - name: Follow-up sequences — G-012
        run: npm run db:verify:followup

      # G-140, ADM-87. The inactive_lead reactivation situation is opt-in per
      # org and per lead: default-off emits nothing, an unenrolled lead emits
      # nothing, a consent-less lead cannot be enrolled, and a direct
      # authenticated PATCH of either flag is refused even to an owner. The
      # last is the check the feature stands on — proved with a minted JWT.
      - name: Reactivation pilot gate — G-140
        run: npm run db:verify:reactivation

      # G-141, ADM-88. Prioritisation is recorded fact-tiers, not a score:
      # quoted > replied > has-conversation > cold, most-recently-active first.
      # Consent-eligible only, and an authenticated caller is pinned to its own
      # tenant even when another org id is passed.
      - name: Reactivation priority — G-141
        run: npm run db:verify:priority

      # G-137 operability. The agency timezone is set through an audited function
      # that validates against pg_timezone_names (UTC accepted), a guard refuses a
      # direct write, and a non-owner is refused.
      - name: Agency timezone — audited, IANA-validated
        run: npm run db:verify:timezone

      # Phase 4/6. Two non-secret operational settings (whatsapp_phone_number_id,
      # whatsapp_test_recipient) set through an audited, whitelisted function — no
      # secret can be smuggled in, a guard refuses a direct write, a member refused.
      - name: Operational settings — whitelisted, audited
        run: npm run db:verify:orgsettings

      # Historical-lead import. Proves, against a real database, that the commit
      # cannot duplicate, cross a tenant, or manufacture consent, and that a
      # name-only row is refused and committed state cannot be forged.
      - name: Lead import — idempotent, tenant-safe, consent-free
        run: npm run db:verify:import

      # Security posture. Proves the structural invariants hold on a fresh DB and
      # that core.security_posture() is authority-gated (a member is refused).
      - name: Security posture — invariants hold, owner-gated
        run: npm run db:verify:security

      # G-012, ADM-69. Everything above exercises the schema the worker refuses
      # with; this runs `runFollowUps` itself against real rows and asserts on
      # database state rather than logs. It found the catch-up flood: a
      # sequence triggered forty days ago fired every overdue attempt on
      # consecutive ticks — seven messages in seven minutes.
      - name: The follow-up worker, executed — G-012
        run: npm run db:verify:worker

      # G-012. The delivery chain after the message row: the real dispatcher,
      # the real claim, the real handler, and a stub HTTP provider behind
      # WHATSAPP_GRAPH_BASE_URL. Found and pins the truthfulness fix: a
      # transient failure whose retry succeeds must end recorded as sent.
      - name: The delivery path, driven — G-012
        run: npm run db:verify:delivery

      # G-214. The window belongs to a NUMBER, not to a thread — which is why
      # an announcement to the owner's own WhatsApp (ADM-95) was refused in
      # production while this system believed it had sent one. Also drives the
      # park and the wake: a quotation that cannot go now is not dropped, and
      # the client's next message brings it through.
      - name: Every outbound message asks the same question — G-214
        run: npm run db:verify:window

      # G-090. A report rather than a repair: the number a message arrived on
      # was never recorded, so which rows were mis-filed cannot be recovered.
      # What it can do is say whether the fingerprint exists today.
      - name: Tenancy overlap — G-090
        run: npm run db:verify:tenancy

      # G-015 and G-109. Both groups' invariants are indexes, and an index is
      # not something a stubbed client can demonstrate.
      - name: WhatsApp groups — G-015, G-109
        run: npm run db:verify:groups

      # Runs against the schema alone, but it must run before anything that
      # provisions a membership: the bootstrap only fires while the deployment
      # is unclaimed, so a claimed database would make every check pass by
      # declining. It restores that state in a `finally` regardless.
      - name: First owner — D19 concurrency
        run: npm run db:verify:owner

      # The remaining four drive the running app, not just the schema — so the
      # app is started and they are run in one step. A background process
      # started in one step and used in the next is a common way for this to
      # go intermittently wrong; keeping them together removes the question.
      - name: Live verification through the running app
        run: |
          set -a && . ./.env.verify.local && set +a
          npm run build
          npm run start > /tmp/app.log 2>&1 &

          for _ in $(seq 1 60); do
            curl -sf -o /dev/null http://localhost:3000/api/health && break
            sleep 2
          done
          if ! curl -sf -o /dev/null http://localhost:3000/api/health; then
            echo "the app never became healthy:"
            cat /tmp/app.log
            exit 1
          fi

          # Any of these failing must show what the app was doing, not just
          # which assertion tripped — the first CI failure here cost three runs
          # to diagnose because the log was only printed when health failed.
          trap 'echo "── app log ──"; cat /tmp/app.log' ERR

          # The steps before this chain plant leads that nothing dispatched; each left a `lead.created` event, and the chain's first scripts
          # dispatch one batch of the OLDEST events. Clear that backlog once (isolated database only) so a batch holds their own events.
          npm run db:drain:events
          npm run db:verify:unlock
          npm run db:verify:reaper
          npm run db:verify:webhook
          npm run db:verify:proposal

          # Needs the app: it drives /api/jobs/run to prove work reaches the
          # agent the job names. Placed with the others rather than beside the
          # schema-only checks, where a first version put it and failed with
          # ECONNREFUSED on a port nothing was listening on yet.
          #
          # After `proposal`, because a tick here claims one agent job of
          # whichever kind comes first — running before it could take the
          # extraction that script is waiting for.
          npm run db:verify:dispatch

          # Phase 2 Finance §4.5: issuing an invoice delivers it to the project
          # group with no further call; a failing provider leaves the channel
          # visible and recovery sends exactly once. Runs a Graph stub on 54398.
          npm run db:verify:invdelivery

          # Phase 2 PM §6: the project manager speaks to the client (welcome,
          # billing question, GST details, payment status), once each, and the
          # client's billing answer reaches staff without confirming anything.
          npm run db:verify:pmcomms

          # Phase 2 Planning §2-§9: the advance verified opens planning; the
          # Project Planning Agent drafts the blueprint (stub model on 54399),
          # corrected once, refused twice writes nothing, a person's plan stands.
          npm run db:verify:planner

          # Phase 2 Finance §9: Phase 7 complete raises the free-maintenance ₹0 document
          # and delivers it; refused while payment is below 100% verified.
          npm run db:verify:freemaint

          # ADM-106: the per-project client-secret vault - admins store and open, every opening
          # is audited, nothing else reads the table, a revoked value is gone.
          npm run db:verify:clientsecrets

          # info@ email outreach: the database refuses what must be refused (suppression, the lawful basis, the
          # warm-up cap, a second person's approval, the owner's stop switch), a bouncing run pauses itself,
          # and the public unsubscribe cannot be triggered by a link scanner.
          npm run db:verify:emailoutreach

          # Inbound email: a reply stops a sequence, an unsubscribe or hard bounce suppresses for good, a client's email lands in
          # their own thread, a stranger is raised and put nowhere, the same message twice changes nothing.
          npm run db:verify:inboundemail

          # Lead generation, slice 1: target services, the versioned ICP, per-channel settings and the two stops are
          # the Admin's alone and tenant-sealed, and a paused channel - or the global stop - makes the email send
          # chokepoint reserve nothing. Driven as the real request roles with real JWT claims; rolls back.
          # Slice 2 adds the identity layer: one person across email, LinkedIn and the REAL WhatsApp ingest stays one contact;
          # uncertain matches open a review and merge nothing; first touch survives later channels; exactly one conversation owner.
          # (psql, not PostgREST: the checks are about the doors, and the doors are SQL.)
          # Slice 3: a prospect who moves to WhatsApp through a tracked reference stays ONE lead (through the real ingest function);
          # a replayed, tampered, cross-tenant, expired, cancelled or closed-lead reference fails safely; a number that belongs to
          # someone else is a review, never a guess. Also asserts the platform's default table privileges were revoked.
          # Slice 4: connections cannot look verified without a real adapter result; a provider credential is encrypted per tenant and
          # unreadable by a session; one policy question (no policy is never permission); an approval covers exactly the content it was
          # given, expires, and a governed side effect runs ONCE (replay, pause-at-execution, uncertain outcome -> reconcile).
          # Slice 5: a meeting or quotation request is a SUBTASK. Only the conversation owner may ask; it may not carry a price; a quote
          # names the confirmed requirements; the link follows the REAL meeting lifecycle (incl. a reschedule's new row) and the real
          # proposal versions; control returns to the owner at the time it ends.
          # Slice 6: qualification is arithmetic then rules that outrank it (a 100 never beats an exclusion, a block or an opt-out); a message may
          # only cite recorded research about THAT prospect; a reply (through the real inbound function) is adopted into ONE identity with the
          # email agent as owner and never takes a lead Sales owns; the real send chokepoint will not cold-email a client or a Sales-owned lead.
          # Slice 7: social content is approved as EXACTLY what is published (the specification's four cases): no approval, no publish; approve V1 then
          # change it and V1's approval cannot publish V2; approve V2 exactly and it publishes; a replay posts nothing twice. The hash cannot be forged,
          # a version cannot be edited, the review can fail a draft but never approve one, and an uncertain outcome is reconciled, never re-posted.
          # Slice 8: an ad campaign launches as EXACTLY what was approved (a budget increase or a targeting change is its own approval and is never
          # automatic); the Admin's cap holds; spend is counted once; a pause is an intent until the platform confirms it; results come from the CRM.
          # Slice 9: a landing page is deployed as exactly what was approved, DEPLOYED is not VERIFIED, a Google ad can only launch to a VERIFIED page,
          # and a visit that becomes a WhatsApp message is credited to its campaign.
          # Slice 10: a marketplace's own rule decides whether a conversation may leave it; a proposal goes out as exactly what was approved and only a
          # person prices it; a person's recorded send is held to the stops, the policy, the limits and the connects budget.
          # Slice 11: results, goals, failures and advice are reads that cannot write and cannot cross a tenant.
          # Slice 12 (hardening + end to end): every finding of three independent reviews is reproduced and must stay refused; the by-hand
          # record_manual_* doors work only for the exact approved version, once; one visitor and one prospect are followed end to end through the
          # real ingest and the tracked handoff; and the emergency stop reaches every governed action.
          npm run db:verify:acquisition
          # Client and project identifiers for life: assigned by the database, unique under concurrency, never edited, never reused.
          npm run db:verify:clientcodes

          # The AI Provider Manager's contract: who may manage providers, models and keys; no path returns a secret;
          # discovered models arrive disabled; a rejected key stays rejected; history is never orphaned.
          npm run db:verify:aiproviders

          # AI routing end to end: a real agent job through the runner against a stub custom provider - MANUAL runs exactly
          # the assignment and substitutes nothing, a rejected key is never asked again, AUTO only chooses what the Admin
          # enabled, every decision is recorded, no secret appears anywhere.
          npm run db:verify:airouting

          # Phase 3 end to end: the kickoff starts it, the PM announces it, the designer drafts screens and
          # three directions, internal review then Admin, the client chooses and confirms, the lock hands
          # Phase 4 an exact handoff. Found: a stopped phase had no way out (resolve_phase_three_stop).
          npm run db:verify:phase3e2e

          # Phase 2 end to end: a won deal to the official kickoff and Phase 3, every human
          # gate a person acting, every automatic step the system alone, the negatives at
          # the moment they matter. (Found six defects the unit suites could not.)
          npm run db:verify:phase2

          # PH1-CLS-002 and G-250. Doc 09 §33: a handoff is a real workflow
          # event, not a note. Wins a deal through the governed path, reads the
          # ai.handoffs row, the outbox row and the packet projection — and
          # since G-250 drives the binding all the way through the RUNNER into
          # a Phase 2 run, which is why it moved here from the schema-only
          # checks above. It failed there with ECONNREFUSED on a port nothing
          # was listening on yet — the identical mistake the comment above
          # `dispatch` was written to prevent, made again.
          #
          # After `dispatch` for the same reason dispatch is after `proposal`:
          # its ticks claim whatever queued job comes first.
          npm run db:verify:handoff

          # Flow 01 end to end: a signed inbound WhatsApp message becomes a
          # lead, the sales agent answers it, the provider receives the answer,
          # and the requirement collector leaves structured requirements behind.
          # Two stubs and only two — the model and Meta's Graph API — because
          # neither belongs to AgencyOS. Last of the app-driven checks: it turns
          # agent replies on for one organization and turns them off again.
          npm run db:verify:flow01

          # What a client sent — a photograph or a voice note — read before
          # anybody answers it (brief §28, Doc 08 §9).
          # After flow01 because it uses the same two stub ports and the same
          # organization, and it also turns agent replies on and off again.
          npm run db:verify:media

          # G-239. The meeting-analysis worker, through the real runner and
          # the same model stub: a completed meeting's typed note becomes an
          # internal summary marked as inference and a PROPOSED requirement
          # version; nothing readable parks the job; a refused answer is
          # retried. Leaves no queued work behind.
          npm run db:verify:analysis

          # Where the leads are lost — Doc 09 §37. Plants a cohort whose every
          # stage is known by construction and checks the counts are exactly it.
          npm run db:verify:funnel

          # The scope AND the price are the agent's; the decision is not —
          # ADM-96, G-162. Needs the app (it drives the runner) and its own
          # model stub.
          npm run db:verify:quotescope

          # ADM-96's other half: approve → the client receives the quotation,
          # changes + note → the agent revises and resubmits. Needs the app,
          # the Graph stub AND the model stub (the reviser calls the model).
          npm run db:verify:quotedispatch

          # G-110, ADM-11. Two negative checks carry this one: a client-audience
          # request must NOT be announced internally (docs/business-os §5.1
          # calls the group an approval channel, not a chat log), and a
          # reference must never be recycled once its request settles — a
          # recycled code makes a late reply land on a different decision.
          #
          # MOVED HERE FROM THE SCHEMA-ONLY LIST, where it had been since it
          # was written and where it stopped belonging the moment §0 was added
          # in PR #320: that section drives /api/jobs/run to prove the
          # announcement actually reaches the group, and no app was listening
          # on 3000 at that point in the job. Every tick failed into its own
          # `.catch(() => '')`, thirty of them in 120ms, and the script
          # reported `0 message(s)` — so `main` went red on the merge of #320
          # and stayed red through #321. It passed on every local run because a
          # dev server was always up. The script's own ticks were never the
          # problem; the position was.
          #
          # Last of the app-driven scripts because each of its ticks also
          # claims one agent job, which would take work `dispatch` and `flow01`
          # are waiting for. It cancels its own queued announcements in a
          # `finally`, so it leaves the queue as it found it.
          npm run db:verify:announce

          # G-176. Beside the announcer because it is the same path seen from
          # the other end: what happens when there is NO channel to announce
          # into. It owns two organizations of its own and resets them at both
          # ends, so it neither reads nor disturbs the demo tenant the scripts
          # above use.
          npm run db:verify:unannounced

          # G-186. After every script that runs an agent, deliberately: it
          # asserts that the ledger's total equals the settled runs' step
          # costs for this organization, so it wants the busiest state the
          # chain produces rather than an empty one. It plants and settles its
          # own runs, deletes them and its own ledger rows in a `finally`, and
          # returns the agency timezone to unset — which `db:verify:followup`
          # asserts this deployment ships without.
          npm run db:verify:spend

          # PDF gap W1. The finance role reads what it was given, the composer
          # and need-more-evidence doors, the immutable verification, numbering
          # and the export log. Plants a client and project under a marker and
          # removes them in a `finally`; restores the numbering settings.
          npm run db:verify:finance-w1

          # PDF gap X1. The owner's expense-category list (add / rename / retire,
          # old expenses keep theirs, a new organization is seeded), the finance
          # role reading a client's name and only that, the GST setup as three
          # whitelisted organization settings, and tenant-scoped receipt paths.
          # Plants a client / category / expenses under a marker; removes them
          # and restores the settings in a `finally`.
          npm run db:verify:finance-x1

          # Stream X2 (owner decisions 2, 11, 12, 13). A plan cannot go live without
          # its internal approval, the audit log is kept forever and an export is
          # itself an audit event, a new organization starts with the 30/20/30/20
          # payment structure, and the contract/migration checks dispatched as a
          # workflow are recorded by two role-gated doors. Plants a project, an
          # environment and an organization under a marker and removes them.
          npm run db:verify:x2

          # Decision 14: search by meaning. A stub embedding vendor on :54397
          # (the runner's OPENAI_BASE_URL); proves the owner-only switch, the
          # indexing job, ranking, role scoping, hash-skip, the budget gate
          # and the ledger. Plants and removes its own clients and users.
          npm run db:verify:semantic

          # Trace C (PDF pages 46 to 63): a person's task reaches done only through
          # a delivery role with evidence and no unverified defect; a missing client
          # dependency is requested of the PM and acknowledged. Plants a project,
          # a plan and users under a marker and removes them.
          npm run db:verify:trace-c

          # Round 3, stream R3 (owner decisions Q-C1, Q-C6, Q-D1, Q-D2, Q-D3): a build,
          # a test run, a bug and a meeting can carry an uploaded file (the doors'
          # role, tenant, size, kind-of-file, credentials and path rules, against the
          # database; Supabase Storage itself is not exercised here), the Google
          # Calendar id is an audited organization setting, and "Generate period
          # report" stores a dated snapshot a period lock may refer to. Creates its
          # own organizations and users and removes them in a `finally`.
          npm run db:verify:r3

          # Round 3, stream R2: a task is completed only from In review; project roles
          # bind (observer read-only, contributor own tasks); a project has default
          # assignees per project role; Start Task is gated by the requirement and
          # dependency checks. Plants users, a project, a plan and an organisation
          # under a marker and removes them.
          npm run db:verify:r2

          # Round 3b, stream S1 (owner decisions R1-3, R3-2): completing Phase 5
          # needs the M2 invoice verified paid (the readiness read lists "M2 not
          # verified paid", the door refuses), and "Generate period report" also
          # stores payments received (verified basis, net of refunds) and the
          # profit-and-loss figures. Creates its own organizations and users and
          # removes them in a `finally`.
          npm run db:verify:s1

          # Round 3b, stream S2 (owner decisions R2-1, R2-2, R2-3): dependencies are
          # per task (audited add/remove doors, same project, no loop, tenancy guards;
          # Start Task names the unfinished task), a project role binds task comments,
          # time logs and checklist items, and the roster-manager exemption reads the
          # role union. Plants its own users, projects and organisation, and removes them.
          npm run db:verify:s2

          # Round 3, stream R1: budget bands are the owner's (audited, validated, tenant-
          # scoped), a person may override the Hot / Warm / Cold label with a reason (the
          # computed label is kept, every change audited), and completing Phase 5 or 6
          # from Development / QA data emits the event that raises M3 / M4 and the PM
          # message. Creates its own users, a second organization and a project under a
          # marker and removes them.
          npm run db:verify:r1

          # Round 3c, stream T1: task attachments obey the project role (observer
          # refused, contributor own tasks only, roster managers exempt by the role
          # union), the roster and default-assignee doors read the role union, and a
          # done dependency is satisfied while one across projects stays refused.
          npm run db:verify:t1

          # Round 3d, stream U1: a task can be cancelled (open statuses only, terminal
          # except a roster manager reopens it) or archived through an audited door,
          # a cancelled or archived task is not outstanding work (dependencies, phase
          # readiness, module progress, QA hand-off), and the project roster is written
          # only through the audited add / change-role / remove doors.
          npm run db:verify:u1

          # Round 3e, stream V1: an archived task is read-only (status, fields,
          # comments, time, checklists, attachments, evidence, dependencies) until a
          # roster manager restores it; a cancel needs a reason, keeps it in the audit
          # row and tells the assignee; a roster change through a door is audited once.
          npm run db:verify:v1

          # Last, and deliberately so: the deploy smoke runs against the app
          # in its most-exercised state, and a tick it fires cannot disturb
          # the four scripts above. The same command, pointed at a real
          # deployment, is the automated half of the runbook's post-deploy
          # verification — the manual rows stay in the runbook.
          npm run smoke
